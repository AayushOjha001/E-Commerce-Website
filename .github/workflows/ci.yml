name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGODB_URI: mongodb://localhost:27018/ecommerce_ci
      # Makes an unreachable database fail the run. Without it, database tests
      # skip themselves and CI would pass having tested nothing.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a throwaway signing secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # The compose file rather than a job service: MongoDB must run as a replica
      # set for transactions, and a service container cannot set that up.
      - name: Start MongoDB
        run: docker compose up --detach --wait mongo

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
