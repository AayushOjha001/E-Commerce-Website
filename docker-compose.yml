# Local development database only.
#
# Runs as a SINGLE-NODE REPLICA SET, not a standalone mongod. Multi-document
# transactions require a replica set — a standalone deployment rejects them with
# "This MongoDB deployment does not support retryable writes", which would break
# transactional order creation (stock decrement + order insert must be atomic).
#
# mongod listens on 27018 rather than the default 27017, and the host maps
# 27018 -> 27018 unchanged. That keeps one address, `localhost:27018`, valid both
# inside the container and on the host, which a replica set needs: the member
# host in the replica set config has to be reachable by mongod itself (to elect
# itself primary) *and* by clients on the host. Mapping 27018 -> 27017 would
# break self-reachability, since nothing would listen on 27018 inside the
# container. 27018 also avoids colliding with any MongoDB already on 27017.
services:
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Doubles as the one-time replica set initiation: rs.status() throws until
      # the set exists, so the catch initiates it. Reports healthy only once a
      # primary has actually been elected, so `depends_on: service_healthy` and
      # the README's "wait for healthy" are both meaningful.
      test: |
        mongosh --port 27018 --quiet --eval '
          try {
            if (rs.status().myState === 1) { quit(0) }
            quit(1)
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27018" }] });
            quit(1)
          }'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  mongo-data:
